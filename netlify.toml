[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# Security headers. No third-party scripts are loaded; Mermaid and Pagefind are self-hosted.
[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Frame-Options = "DENY"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Legacy MkDocs Material routes. Articles keep their original /<slug>/ URLs;
# listing pages from the old blog plugin move to /writing/.
[[redirects]]
from = "/archive/*"
to = "/writing/"
status = 301

[[redirects]]
from = "/category/*"
to = "/writing/"
status = 301

[[redirects]]
from = "/page/*"
to = "/writing/"
status = 301

[[redirects]]
from = "/tags/"
to = "/writing/"
status = 301

[[redirects]]
from = "/blog/"
to = "/writing/"
status = 301
